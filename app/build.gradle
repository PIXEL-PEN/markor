apply plugin: 'com.android.application'
if (enable_plugin_kotlin) {
    apply plugin: 'kotlin-android'
    apply plugin: 'kotlin-android-extensions'
    apply plugin: 'kotlin-kapt'
}

rootProject.ext.version_minSdk = 24
ext.version_library_flexmark = "0.42.14"

android {
    buildToolsVersion rootProject.ext.version_buildTools
    compileSdkVersion rootProject.ext.version_compileSdk

    defaultConfig {
        applicationId "net.pixelpen.journal"
        versionCode Integer.parseInt(new Date().format('yyMMdd'))
        versionName "1.2.5"

        minSdkVersion rootProject.ext.version_minSdk
        targetSdkVersion rootProject.ext.version_compileSdk
        multiDexEnabled true

        resValue "string", "manifest_package_id", "net.pixelpen.journal"

        // English only. The 63 inherited locale folders are incomplete and carry none of
        // Autumn's own strings, so shipping them advertised translations that do not exist.
        // The folders stay in the repo; this keeps them out of the APK.
        resConfigs "en"

        // Was set per-flavour; now per-build-type (true in debug, false in release).
        buildConfigField "boolean", "IS_TEST_BUILD", "false"
        // Kept defined though nothing reads it, so a future Play-specific branch has a hook.
        buildConfigField "boolean", "IS_GPLAY_BUILD", "false"
        // Name of the archive folder under /Documents. Debug builds override this
        // so a side-by-side preview install can never touch the live archive.
        buildConfigField "String", "STORAGE_ROOT_NAME", "\"Autumn\""
        buildConfigField "String[]", "DETECTED_ANDROID_LOCALES", "${findUsedAndroidLocales()}"
        buildConfigField "String", "BUILD_DATE", "\"${getBuildDate()}\""
        buildConfigField "String", "GITHASH", "\"${getGitHash}\""
        buildConfigField "String", "GITMSG", "\"${getGitLastCommitMessage}\""

        setProperty("archivesBaseName", applicationId + "-v" + versionCode + "-" + versionName)
    }

    // No product flavors.
    //
    // There used to be four (flavorAtest, flavorDefault, pixelpen, flavorGplay), which meant
    // eight build variants for the IDE to index and four icon source sets to keep in step. They
    // also carried real hazards: flavorAtest shipped upstream's applicationId
    // (net.pixelpen.journal_test), and the IDE defaulted to it because it sorted first.
    //
    // The two variants that remain are debug (side-by-side preview) and release.
    // The pixelpen flavour's launcher icons were promoted into src/main/res.

    lintOptions {
        abortOnError false
        disable 'MissingTranslation', 'InvalidPackage', 'ObsoleteLintCustomCheck', 'DefaultLocale',
                'UnusedAttribute', 'VectorRaster', 'InflateParams', 'IconLocation',
                'UnusedResources', 'TypographyEllipsis'
    }

    sourceSets {
        main { assets.srcDirs = ['src/main/assets'] }
        if (enable_plugin_kotlin) {
            main.java.srcDirs += 'src/main/kotlin'
        }
        main.java.srcDirs += 'thirdparty/java'
        main.res.srcDirs += 'thirdparty/res'
        main.assets.srcDirs += 'thirdparty/assets'
    }

    buildTypes {
        debug {
            // Installs as net.pixelpen.journal.dev, so a debug build and a release build can
            // sit side by side. They no longer look different in the launcher: debug used to
            // override app_name to "DEV Autumn", with the marker deliberately at the front
            // because launchers truncate the end and a trailing "(dev)" vanished. That override
            // is gone -- there is only ever one of them installed here -- so if both are ever
            // present again they will be two identically named icons, and this is the line that
            // allows it.
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            buildConfigField "boolean", "IS_TEST_BUILD", "true"
            // Debug builds read and write /Documents/Autumn (dev), NOT the live
            // archive. Copy real notes in by hand when you want realistic test data.
            buildConfigField "String", "STORAGE_ROOT_NAME", "\"Autumn (dev)\""
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            // Signed with the DEBUG key, so assembleRelease produces something installable for
            // testing on your own and a friend's phone. It is a release build in every other
            // respect: applicationId net.pixelpen.journal with no .dev suffix, so it installs
            // beside the debug build, and STORAGE_ROOT_NAME stays "Autumn" from defaultConfig
            // rather than "Autumn (dev)".
            //
            // NOT for distribution. The debug keystore ships with the Android SDK and its
            // password is public, so anyone can sign an update that Android will accept as this
            // app. Google Play rejects debug-signed uploads outright. Replace this with a real
            // signingConfig before the app goes anywhere, and note that the first install under
            // a new key has to be a clean one: Android refuses an update whose signature changed.
            signingConfig signingConfigs.debug
        }
    }

    splits {
        abi { enable false }
        density { enable false }
        language { enable false }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE-LGPL-2.1.txt', 'META-INF/LICENSE-LGPL-3.txt', 'META-INF/LICENSE-W3C-TEST']
        }
    }

    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    namespace 'net.pixelpen.journal'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.13.1'

    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.legacy:legacy-preference-v14:1.0.0'
    implementation 'androidx.browser:browser:1.4.0'

    implementation "com.vladsch.flexmark:flexmark:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-util:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-emoji:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-gfm-tasklist:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-superscript:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-autolink:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-toc:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-tables:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-jekyll-front-matter:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-jekyll-tag:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-anchorlink:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-gfm-strikethrough:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-yaml-front-matter:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-footnotes:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-gitlab:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-typographic:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-admonition:${version_library_flexmark}"

    implementation('com.opencsv:opencsv:3.10') {
        exclude group: 'commons-beanutils', module: 'commons-beanutils'
    }

    implementation 'com.github.Pixplicity:gene-rate:v1.1.8'
    implementation 'com.github.AppIntro:AppIntro:6.2.0'
    implementation 'com.github.mertakdut:EpubParser:1.0.95'
    implementation 'com.github.martin-stone:hsv-alpha-color-picker-android:3.1.0'

    implementation 'commons-io:commons-io:2.7'
    if (enable_plugin_kotlin) {
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${version_plugin_kotlin}"
    }

    def anpros = []
    for (anpro in anpros) {
        if (enable_plugin_kotlin) {
            kapt anpro
        } else {
            annotationProcessor anpro
        }
    }
}
