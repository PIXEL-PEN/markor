// Top-level build file where you can add configuration options common to all sub-projects/modules.

import java.text.SimpleDateFormat

buildscript {
    ext {
        version_gradle_tools = '8.8.0'
        version_plugin_kotlin = "1.3.72"
        enable_plugin_kotlin = false

        version_compileSdk = 35
        version_buildTools = "35.0.0"
        version_minSdk = 17
    }

    repositories {
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url "https://jitpack.io" }
        google()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${version_gradle_tools}"
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        if (project.enable_plugin_kotlin) {
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${version_plugin_kotlin}"
        }

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url "https://jitpack.io" }
        google()
    }

    tasks.matching { task -> task.name.matches('(.*generate.*Resources)|(.*map.*SourceSetPaths)') }.all {
        task -> task.dependsOn copyRepoFiles
    }

    tasks.matching { it instanceof Test }.all { // Enable unit test output, html+xml output
        testLogging.events "passed", "skipped", "failed", "standardOut", "standardError"
        testLogging.showStandardStreams = true
        reports{
            junitXml { enabled true }
            html { enabled true }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// One file, and it has a reader: R.raw.license.txt is what the About screen's licence row
// shows.
//
// README.md used to be copied too, and the note here claimed ApplicationObject referenced
// it. True in the letter and misleading in substance: R.raw.readme appears only in the
// unused_ignore array, whose whole purpose is to stop the resource shrinker discarding it.
// Nothing could open it. So the APK carried a GitHub-facing document, links and all, that
// no screen in the app could reach, in a binary with no network. The credit it carried is
// now in licenses_3rd_party.md, where there is a screen to read it on.
//
// CHANGELOG.md and CONTRIBUTORS.md went the same way earlier, read by a launch dialog and
// an About row that are both gone. CONTRIBUTORS.md is deleted; the changelog stays in the
// repo only.
final String[] ROOT_TO_RAW_COPYFILES = ["LICENSE.txt"]
task copyRepoFiles(type: Copy) {
    from rootProject.files(ROOT_TO_RAW_COPYFILES)
    into "app/src/main/res/raw"
    rename { String fileName -> fileName.replace(fileName, fileName.toLowerCase()) }
}


@SuppressWarnings(["UnnecessaryQualifiedReference", "SpellCheckingInspection", "GroovyUnusedDeclaration"])
// Returns used android languages as a buildConfig array: {'de', 'it', ..}"
static String findUsedAndroidLocales() {
    Set<String> langs = new HashSet<>()
    new File('.').eachFileRecurse(groovy.io.FileType.DIRECTORIES) {
        final foldername = it.name
        if (foldername.contains('values-') && !it.absolutePath.contains("build" + File.separator + "intermediates") && !foldername.matches(".*values-((.*[0-9])|(land)|(port)).*")) {
            new File(it.toString()).eachFileRecurse(groovy.io.FileType.FILES) {
                if (it.exists() && it.name.toLowerCase().endsWith(".xml") && it.getText('UTF-8').contains("<string")) {
                    langs.add(foldername.replace("values-", ""))
                }
            }
        }
    }
    return '{' + langs.sort().collect { "\"${it}\"" }.join(",") + '}'
}



ext.getGitHash = providers.exec {
    commandLine('git', 'rev-parse', 'HEAD')
}.standardOutput.asText.get().trim()

@SuppressWarnings(["UnnecessaryQualifiedReference", "SpellCheckingInspection", "GroovyUnusedDeclaration"])
// The build date, as a person would write it, in the build machine's own time zone.
//
// It was RFC3339 in UTC: "2026-11-08T11:29Z". That sorts correctly as plain text and is
// unambiguous anywhere, which matters when a machine reads it and not at all when the only
// readers are whoever is holding the phone. UTC also made it read an hour or more off the
// clock of the machine that produced it, which is a small puzzle in a screen that should
// answer questions rather than raise them.
//
// Locale.ENGLISH is pinned deliberately: the default locale would make the month name follow
// whatever the build machine happens to be set to, so the same build date would be spelled
// differently depending on where it was compiled. The zone is printed, so a build handed to
// someone in another country still says what its time means.
static String getBuildDate() {
    return new SimpleDateFormat("d MMM yyyy, HH:mm z", Locale.ENGLISH).format(new Date())
}
